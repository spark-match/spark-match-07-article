# =============================================================================
# CI - Build LaTeX PDF (Pull Request)
# =============================================================================
# Este workflow es un CALLER del reusable workflow en:
#   spark-match/spark-match-01-devops/.github/workflows/latex-build.yml
# =============================================================================

name: CI - Build PDF (Pull Request)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "**.tex"
      - "**.bib"
      - "figures/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Compile LaTeX
    uses: spark-match/spark-match-01-devops/.github/workflows/latex-build.yml@main
    with:
      root-file: main.tex
      artifact-name: spark-match-paper-pr-${{ github.event.pull_request.number }}
      retention-days: 14