# =============================================================================
# CD - Continuous Deployment (Release on merged Pull Request)
# =============================================================================
# Trigger: Pull Request 'closed' event targeting 'main' AND merged == true.
# Action:  Compile the LaTeX document, auto-bump the patch version from the
#          latest git tag, create the new tag and publish a GitHub Release
#          with the PDF attached.
# Notes:   This workflow is the ONLY place where tags/releases are created.
#          Manual tags v*.*.* are honored as the baseline for the next bump;
#          e.g. if the latest tag is v1.2.3 the next release will be v1.2.4.
#          For a major/minor bump create the tag manually first.
# =============================================================================

name: CD - Release on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    name: Build & Release PDF
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CLEAN=${LATEST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "Latest tag: ${LATEST}"
          echo "Next version: ${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          latexmk_shell_escape: false

      - name: Rename PDF with version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp main.pdf "spark-match-paper-${VERSION}.pdf"
          ls -la spark-match-paper-*.pdf

      - name: Create GitHub Release with PDF
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Spark Match Paper - ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: spark-match-paper-*.pdf
          body: |
            ## Spark Match Paper - ${{ steps.version.outputs.version }}

            Released automatically from merged Pull Request.

            - **PR:** #${{ github.event.pull_request.number }} -- ${{ github.event.pull_request.title }}
            - **Author:** @${{ github.event.pull_request.user.login }}
            - **Merged at:** ${{ github.event.pull_request.merged_at }}
            - **SHA:** `${{ github.event.pull_request.merge_commit_sha }}`

            ### Descripcion
            Articulo academico del Trabajo de Fin de Programa (UNI -- II Programa de
            Especializacion en IA Generativa y Machine Learning Ops) sobre Spark Match:
            copiloto de orientacion vocacional basado en IA Generativa y MLOps.

            ### Descargar
            El PDF adjunto contiene el articulo completo correspondiente a esta version.