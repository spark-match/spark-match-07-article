# =============================================================================
# CD - Release on Merged Pull Request
# =============================================================================
# Este workflow es un CALLER del reusable workflow en:
#   spark-match/spark-match-01-devops/.github/workflows/latex-release.yml
# =============================================================================

name: CD - Release on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # Required para crear tags + releases

jobs:
  release:
    name: Build & Release PDF
    if: github.event.pull_request.merged == true
    uses: spark-match/spark-match-01-devops/.github/workflows/latex-release.yml@main
    with:
      root-file: main.tex
      release-name-prefix: Spark Match Paper
